name: safety regression

on:
  pull_request:
    paths:
      - "Cargo.lock"
      - "Cargo.toml"
      - "crates/**"
      - "fuzz/**"
      - "scripts/**"
      - "tests/**"
      - ".github/workflows/safety.yml"
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  properties-and-models:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: stable
      - run: cargo test -p moraebox-protocol -p moraebox-box -p moraebox-image --locked property_
      - run: cargo test -p moraebox-runtime --test loom_models --locked
      - run: cargo check --manifest-path fuzz/Cargo.toml --all-targets --locked
      - run: go test ./...
        working-directory: crates/moraebox-vmm-helper/guest-agent

  fuzz-smoke:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: nightly
      - run: cargo install cargo-fuzz --locked --version 0.13.2
      - run: cargo fuzz run protocol_decode -- -runs=256
      - run: cargo fuzz run box_bundle -- -runs=256
      - run: cargo fuzz run image_reference -- -runs=256

  miri:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # nightly
        with:
          toolchain: nightly
          components: miri
      - run: scripts/miri-smoke.sh

  process-performance:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: stable
      - name: Measure bounded process baseline
        run: >-
          cargo run -p moraebox-cli --locked -- --json benchmark
          --backend process --iterations 10 --concurrency 2
          /usr/bin/printf ready
          > benchmark-report.json
      - run: scripts/check-benchmark-thresholds.py benchmark-report.json tests/benchmark-thresholds.json
