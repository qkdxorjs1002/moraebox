name: Release

on:
  push:
    tags:
      - "*.*.*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Publish source release and Homebrew formula
    runs-on: macos-15
    permissions:
      contents: write

    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: crates/moraebox-vmm-helper/guest-agent/go.mod
          cache: false

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: stable
          components: rustfmt, clippy

      - name: Validate release tag
        id: version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail

          release_pattern='^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-(alpha|beta|rc)(0|[1-9][0-9]*))?$'
          if [[ ! "${RELEASE_TAG}" =~ ${release_pattern} ]]; then
            echo "Release tags must use x.y.z or x.y.z-(alpha|beta|rc)N without a leading v; got ${RELEASE_TAG}." >&2
            exit 1
          fi

          prerelease=false
          if [[ "${RELEASE_TAG}" == *-* ]]; then
            prerelease=true
          fi

          echo "version=${RELEASE_TAG}" >> "${GITHUB_OUTPUT}"
          echo "prerelease=${prerelease}" >> "${GITHUB_OUTPUT}"
          echo "archive=moraebox-${RELEASE_TAG}.tar.gz" >> "${GITHUB_OUTPUT}"

      - name: Synchronize workspace version
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          import os
          from pathlib import Path
          import re

          manifest = Path("Cargo.toml")
          release_version = os.environ["RELEASE_VERSION"]
          lines = manifest.read_text(encoding="utf-8").splitlines(keepends=True)
          in_workspace_package = False
          replacements = 0

          for index, line in enumerate(lines):
              stripped = line.strip()
              if stripped.startswith("[") and stripped.endswith("]"):
                  in_workspace_package = stripped == "[workspace.package]"
                  continue
              if in_workspace_package and line.startswith("version = "):
                  newline = "\n" if line.endswith("\n") else ""
                  lines[index] = f'version = "{release_version}"{newline}'
                  replacements += 1

          if replacements != 1:
              raise SystemExit(
                  f"expected one [workspace.package] version, replaced {replacements}"
              )
          manifest.write_text("".join(lines), encoding="utf-8")

          path_dependency_replacements = 0
          version_pattern = re.compile(r'(version\s*=\s*")[^"]+(".*)')
          for crate_manifest in sorted(Path("crates").glob("*/Cargo.toml")):
              lines = crate_manifest.read_text(encoding="utf-8").splitlines(keepends=True)
              for index, line in enumerate(lines):
                  if 'path = "../moraebox-' not in line:
                      continue
                  updated, count = version_pattern.subn(
                      rf'\g<1>{release_version}\2', line, count=1
                  )
                  if count != 1:
                      raise SystemExit(
                          f"missing version on internal path dependency in {crate_manifest}: {line.strip()}"
                      )
                  lines[index] = updated
                  path_dependency_replacements += 1
              crate_manifest.write_text("".join(lines), encoding="utf-8")

          if path_dependency_replacements == 0:
              raise SystemExit("expected at least one internal path dependency version")
          PY

          workspace_version="$(
            cargo metadata --no-deps --format-version 1 |
              python3 -c 'import json, sys; data = json.load(sys.stdin); print(next(package["version"] for package in data["packages"] if package["name"] == "moraebox-cli"))'
          )"
          if [[ "${RELEASE_VERSION}" != "${workspace_version}" ]]; then
            echo "Could not synchronize workspace version to ${RELEASE_VERSION}; got ${workspace_version}." >&2
            exit 1
          fi

      - name: Require Homebrew tap credential
        env:
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${HOMEBREW_TAP_TOKEN}" ]]; then
            echo "Missing required release secret: HOMEBREW_TAP_TOKEN" >&2
            exit 1
          fi

      - name: Run release quality gate
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --all -- --check
          cargo clippy --workspace --all-targets -- -D warnings
          cargo test --workspace

      - name: Prepare versioned source archive
        id: source
        env:
          ARCHIVE_NAME: ${{ steps.version.outputs.archive }}
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail

          staging_root="$(mktemp -d "${RUNNER_TEMP}/moraebox-source.XXXXXX")"
          bundle="${staging_root}/moraebox-${RELEASE_VERSION}"
          mkdir -p "${bundle}" release-dist
          git checkout-index --all --prefix="${bundle}/"

          # The tag may intentionally retain a neutral workspace version. Include
          # the validated release version and its refreshed lockfile in the source
          # archive consumed by Homebrew.
          install -m 0644 Cargo.toml Cargo.lock "${bundle}/"
          while IFS= read -r crate_manifest; do
            install -m 0644 "${crate_manifest}" "${bundle}/${crate_manifest}"
          done < <(find crates -mindepth 2 -maxdepth 2 -name Cargo.toml -print)

          SOURCE_DATE_EPOCH="$(git show -s --format=%ct HEAD)" \
            python3 - "${bundle}" "release-dist/${ARCHIVE_NAME}" <<'PY'
          import gzip
          import os
          from pathlib import Path
          import sys
          import tarfile

          source_root = Path(sys.argv[1])
          output = Path(sys.argv[2])
          source_date_epoch = int(os.environ["SOURCE_DATE_EPOCH"])
          paths = [source_root, *sorted(source_root.rglob("*"))]

          with output.open("wb") as output_file:
              with gzip.GzipFile(
                  filename="", mode="wb", fileobj=output_file, mtime=0
              ) as compressed:
                  with tarfile.open(
                      fileobj=compressed, mode="w", format=tarfile.PAX_FORMAT
                  ) as archive:
                      for path in paths:
                          archive_name = path.relative_to(source_root.parent)
                          info = archive.gettarinfo(
                              name=str(path), arcname=str(archive_name)
                          )
                          info.uid = 0
                          info.gid = 0
                          info.uname = ""
                          info.gname = ""
                          info.mtime = source_date_epoch
                          if info.isfile():
                              with path.open("rb") as source_file:
                                  archive.addfile(info, source_file)
                          else:
                              archive.addfile(info)
          PY
          archive_sha256="$(shasum -a 256 "release-dist/${ARCHIVE_NAME}" | awk '{print $1}')"
          printf '%s  %s\n' "${archive_sha256}" "${ARCHIVE_NAME}" > \
            "release-dist/${ARCHIVE_NAME}.sha256"

          echo "sha256=${archive_sha256}" >> "${GITHUB_OUTPUT}"
          ls -lh release-dist

      - name: Verify source archive
        env:
          ARCHIVE_NAME: ${{ steps.version.outputs.archive }}
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail

          verify_root="$(mktemp -d "${RUNNER_TEMP}/moraebox-source-verify.XXXXXX")"
          tar -C "${verify_root}" -xzf "release-dist/${ARCHIVE_NAME}"
          source_root="${verify_root}/moraebox-${RELEASE_VERSION}"
          test -f "${source_root}/Cargo.toml"
          test -f "${source_root}/Cargo.lock"
          test -f "${source_root}/LICENSE"
          test -f "${source_root}/assets/moraebox-vmm.entitlements"
          test "$(
            cargo metadata \
              --manifest-path "${source_root}/Cargo.toml" \
              --locked \
              --no-deps \
              --format-version 1 |
              python3 -c 'import json, sys; data = json.load(sys.stdin); print(next(package["version"] for package in data["packages"] if package["name"] == "moraebox-cli"))'
          )" = "${RELEASE_VERSION}"

      - name: Publish GitHub source release
        env:
          ARCHIVE_NAME: ${{ steps.version.outputs.archive }}
          GH_TOKEN: ${{ github.token }}
          RELEASE_PRERELEASE: ${{ steps.version.outputs.prerelease }}
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail

          if gh release view "${RELEASE_TAG}" >/dev/null 2>&1; then
            edit_args=(--title "moraebox ${RELEASE_VERSION}")
            if [[ "${RELEASE_PRERELEASE}" == "true" ]]; then
              edit_args+=(--prerelease)
            else
              edit_args+=(--prerelease=false)
            fi
            gh release edit "${RELEASE_TAG}" "${edit_args[@]}"

            existing_release_dir="$(mktemp -d "${RUNNER_TEMP}/moraebox-existing-release.XXXXXX")"
            if gh release download "${RELEASE_TAG}" \
              --pattern "${ARCHIVE_NAME}" \
              --dir "${existing_release_dir}" >/dev/null 2>&1; then
              existing_sha256="$(shasum -a 256 "${existing_release_dir}/${ARCHIVE_NAME}" | awk '{print $1}')"
              current_sha256="$(shasum -a 256 "release-dist/${ARCHIVE_NAME}" | awk '{print $1}')"
              if [[ "${existing_sha256}" != "${current_sha256}" ]]; then
                echo "Refusing to replace immutable source archive ${ARCHIVE_NAME}." >&2
                exit 1
              fi
            fi
            gh release upload "${RELEASE_TAG}" release-dist/* --clobber
          else
            create_args=(--title "moraebox ${RELEASE_VERSION}" --generate-notes)
            if [[ "${RELEASE_PRERELEASE}" == "true" ]]; then
              create_args+=(--prerelease)
            fi
            gh release create "${RELEASE_TAG}" release-dist/* "${create_args[@]}"
          fi

      - name: Checkout Homebrew tap
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: qkdxorjs1002/homebrew-tap
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: homebrew-tap

      - name: Update Homebrew formula
        env:
          ARCHIVE_NAME: ${{ steps.version.outputs.archive }}
          ARCHIVE_SHA256: ${{ steps.source.outputs.sha256 }}
          RELEASE_PRERELEASE: ${{ steps.version.outputs.prerelease }}
          RELEASE_TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p homebrew-tap/Formula homebrew-tap/Aliases
          ruby - "homebrew-tap" <<'RUBY'
          require "fileutils"
          require "pathname"

          tap_root = Pathname(ARGV.fetch(0))
          repository = ENV.fetch("GITHUB_REPOSITORY")
          tag = ENV.fetch("RELEASE_TAG")
          archive = ENV.fetch("ARCHIVE_NAME")
          sha256 = ENV.fetch("ARCHIVE_SHA256")
          prerelease = ENV.fetch("RELEASE_PRERELEASE") == "true"

          def gvproxy_formula_content
            <<~FORMULA
            class Gvproxy < Formula
              desc "User-mode network stack for virtual machines"
              homepage "https://github.com/containers/gvisor-tap-vsock"
              url "https://github.com/containers/gvisor-tap-vsock/archive/refs/tags/v0.8.9.tar.gz"
              sha256 "6cbcb7959a5d90b59253ea6d8bdf0285e2cfbc3b301398704b41e3069293f4fb"
              license "Apache-2.0"

              depends_on "go" => :build

              def install
                system "make", "gvproxy", "GIT_VERSION=v\#{version}"
                bin.install "bin/gvproxy"
              end

              test do
                assert_match "gvproxy version v\#{version}",
                             shell_output("\#{bin}/gvproxy --version")
              end
            end
            FORMULA
          end

          def libkrunfw_formula_content
            <<~FORMULA
            class Libkrunfw < Formula
              desc "Dynamic library bundling a Linux kernel in a convenient storage format"
              homepage "https://github.com/containers/libkrunfw"
              url "https://github.com/containers/libkrunfw/releases/download/v5.5.0/libkrunfw-prebuilt-aarch64.tgz"
              version "5.5.0"
              sha256 "5bfae6efee63dbdf04a8fac2a69d772d9f900af2f54c4429b4acdfd6d86b9979"
              license all_of: ["GPL-2.0-only", "LGPL-2.1-only"]

              depends_on arch: :arm64

              def install
                system "make"
                system "make", "PREFIX=\#{prefix}", "install"
              end

              test do
                (testpath/"test.c").write <<~EOS
                  int krunfw_get_version();

                  int main()
                  {
                    int version = krunfw_get_version();
                    return version > 0 ? 0 : 1;
                  }
                EOS
                system ENV.cc, "test.c", "-I\#{include}", "-L\#{lib}",
                       "-lkrunfw", "-o", "test"
                system "./test"
              end
            end
            FORMULA
          end

          def libkrun_formula_content
            <<~FORMULA
            class Libkrun < Formula
              desc "Dynamic library providing microVM-based process isolation"
              homepage "https://github.com/libkrun/libkrun"
              url "https://github.com/containers/libkrun/archive/refs/tags/v1.19.4.tar.gz"
              sha256 "e8775fab2b460972a67ca6cd936296bb79cdb078d852d712a283cb290dd0b284"
              license "Apache-2.0"

              depends_on "lld" => :build
              depends_on "llvm@22" => :build
              depends_on "rust" => :build
              depends_on arch: :arm64
              depends_on "dtc"
              depends_on "libkrunfw"
              depends_on "xz"

              def install
                ENV["LIBCLANG_PATH"] = formula_opt_lib("llvm@22").to_s
                system "make", "BLK=1", "NET=1", "TIMESYNC=1"
                system "make", "PREFIX=\#{prefix}", "install"
              end

              test do
                (testpath/"test.c").write <<~EOS
                  #include <libkrun.h>

                  int main()
                  {
                    int context = krun_create_ctx();
                    (void)context;
                    return 0;
                  }
                EOS
                system ENV.cc, "test.c", "-I\#{include}", "-L\#{lib}",
                       "-lkrun", "-o", "test"
                system "./test"
              end
            end
            FORMULA
          end

          def formula_content(class_name:, conflict:, repository:, tag:, archive:, sha256:)
            formula = <<~FORMULA
            class #{class_name} < Formula
              desc "Disposable microVM sandbox for coding agents"
              homepage "https://github.com/#{repository}"
              url "https://github.com/#{repository}/releases/download/#{tag}/#{archive}"
              sha256 "#{sha256}"
              license "Apache-2.0"

              depends_on "rust" => :build
              depends_on "go" => :build
              depends_on arch: :arm64
              depends_on "e2fsprogs"
              depends_on "gvproxy"
              depends_on "libkrun"
              depends_on "libkrunfw"
              depends_on :macos

              __CONFLICT__

              def install
                system "cargo", "install", *std_cargo_args(path: "crates/moraebox-cli")
                system "cargo", "install", *std_cargo_args(path: "crates/moraebox-mcp")
                system "cargo", "install", *std_cargo_args(path: "crates/moraebox-vmm-helper")
                doc.install "LICENSE"

                helper = bin/"morae-vmm-helper"
                helper.chmod 0755
                system "/usr/bin/codesign", "--force", "--sign", "-",
                       "--entitlements", "assets/moraebox-vmm.entitlements", helper
                system "/usr/bin/codesign", "--verify", "--strict", helper
              end

              def caveats
                <<~EOS
                  Homebrew builds moraebox on this Mac and ad-hoc signs the VMM helper
                  with its Hypervisor entitlement. The signature does not identify a
                  developer and the locally built executable is not Apple-notarized.

                  This formula also installs the pinned gvproxy 0.8.9, libkrun 1.19.4,
                  and libkrunfw 5.5.0 runtime dependencies from this tap. moraebox
                  automatically discovers the signed helper and these dependencies, so
                  native execution and opt-in networking require no shell configuration:

                    morae run --image alpine@latest -- /bin/uname -a

                  Run `morae doctor --json` to inspect the exact paths and signing gate.
                EOS
              end

              test do
                assert_match version.to_s, shell_output("\#{bin}/morae --version")
                assert_equal "morae\\n",
                             shell_output("\#{bin}/morae run --backend process -- /bin/echo morae")
                assert_match "stdio MCP server", shell_output("\#{bin}/morae-mcp --help")
                doctor = JSON.parse(shell_output("\#{bin}/morae doctor --json"))
                assert doctor.dig("gvproxy", "found")
                assert doctor.dig("libkrun", "found")
                assert doctor.dig("libkrunfw", "found")
                assert doctor["native_backend_ready"]
                assert doctor["native_network_ready"]
                native_error = shell_output(
                  "\#{bin}/morae run --backend libkrun -- /bin/true 2>&1", 1
                )
                assert_match "--rootfs, --image, or MORAE_ROOTFS", native_error
                entitlements = shell_output(
                  "/usr/bin/codesign -d --entitlements - \#{bin}/morae-vmm-helper 2>&1",
                )
                assert_match "com.apple.security.hypervisor", entitlements
              end
            end
            FORMULA
            conflict_line =
              if conflict
                %(  conflicts_with "#{conflict}", because: "both install the moraebox executables"\n\n)
              else
                ""
              end
            formula.sub("  __CONFLICT__\n\n", conflict_line)
          end

          (tap_root/"Formula/gvproxy.rb").write(gvproxy_formula_content)
          (tap_root/"Formula/libkrunfw.rb").write(libkrunfw_formula_content)
          (tap_root/"Formula/libkrun.rb").write(libkrun_formula_content)

          stable_formula_available =
            !prerelease || (tap_root/"Formula/moraebox.rb").exist?
          pre_formula = tap_root/"Formula/moraebox-pre.rb"
          pre_formula.write(
            formula_content(
              class_name: "MoraeboxPre",
              conflict: stable_formula_available ? "moraebox" : nil,
              repository: repository,
              tag: tag,
              archive: archive,
              sha256: sha256,
            ),
          )
          FileUtils.ln_sf("../Formula/moraebox-pre.rb", tap_root/"Aliases/moraebox@pre")

          unless prerelease
            (tap_root/"Formula/moraebox.rb").write(
              formula_content(
                class_name: "Moraebox",
                conflict: "moraebox-pre",
                repository: repository,
                tag: tag,
                archive: archive,
                sha256: sha256,
              ),
            )
          end
          RUBY

          formula_files=(
            homebrew-tap/Formula/gvproxy.rb
            homebrew-tap/Formula/libkrunfw.rb
            homebrew-tap/Formula/libkrun.rb
            homebrew-tap/Formula/moraebox-pre.rb
          )
          if [[ "${RELEASE_PRERELEASE}" == "false" ]]; then
            formula_files+=(homebrew-tap/Formula/moraebox.rb)
          fi
          for formula_file in "${formula_files[@]}"; do
            ruby -c "${formula_file}"
          done
          brew style "${formula_files[@]}"

      - name: Commit Homebrew formula
        env:
          RELEASE_PRERELEASE: ${{ steps.version.outputs.prerelease }}
          RELEASE_TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail

          git -C homebrew-tap config user.name "github-actions[bot]"
          git -C homebrew-tap config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          tap_paths=(
            Formula/gvproxy.rb
            Formula/libkrunfw.rb
            Formula/libkrun.rb
            Formula/moraebox-pre.rb
            Aliases/moraebox@pre
          )
          release_channel="prerelease"
          if [[ "${RELEASE_PRERELEASE}" == "false" ]]; then
            tap_paths+=(Formula/moraebox.rb)
            release_channel="stable"
          fi
          git -C homebrew-tap add "${tap_paths[@]}"

          if git -C homebrew-tap diff --cached --quiet; then
            echo "Homebrew tap is already up to date."
            exit 0
          fi

          git -C homebrew-tap commit -m "moraebox ${RELEASE_TAG} (${release_channel})"
          for attempt in 1 2 3; do
            git -C homebrew-tap fetch --no-tags origin main
            if ! git -C homebrew-tap rebase origin/main; then
              echo "Homebrew tap update conflicts with origin/main; refusing to resolve it automatically." >&2
              git -C homebrew-tap rebase --abort
              exit 1
            fi

            if git -C homebrew-tap push origin HEAD:main; then
              exit 0
            fi
            if [[ "${attempt}" -eq 3 ]]; then
              echo "Could not push the Homebrew tap after ${attempt} attempts." >&2
              exit 1
            fi

            echo "Homebrew tap changed during push; retrying (${attempt}/3)." >&2
            sleep $((attempt * 2))
          done
