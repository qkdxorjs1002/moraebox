[workspace]
members = [
    "crates/moraebox-box",
    "crates/moraebox-core",
    "crates/moraebox-protocol",
    "crates/moraebox-image",
    "crates/moraebox-runtime",
    "crates/moraebox-sdk",
    "crates/moraebox-cli",
    "crates/moraebox-mcp",
    "crates/moraebox-vmm-helper",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/qkdxorjs1002/moraebox"
rust-version = "1.85"

[workspace.dependencies]
async-trait = "0.1.89"
base64 = "0.22.1"
flate2 = "1.1.2"
fs2 = "0.4.3"
futures-util = "0.3.31"
clap = { version = "4.5.46", features = ["derive"] }
humantime = "2.2.0"
httpdate = "1.0.3"
libc = "0.2.175"
libloading = "0.8.8"
nix = { version = "0.30.1", features = ["fs", "signal", "term"] }
prost = "0.14.1"
reqwest = { version = "0.12.23", default-features = false, features = ["json", "rustls-tls", "stream"] }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.143"
sha2 = "0.10.9"
thiserror = "2.0.16"
tar = "0.4.44"
tempfile = "3.21.0"
tokio = { version = "1.47.1", features = ["fs", "io-std", "io-util", "macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }
uuid = { version = "1.18.0", features = ["serde", "v4"] }
zstd = "0.13.3"

[workspace.lints.rust]
unsafe_code = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
